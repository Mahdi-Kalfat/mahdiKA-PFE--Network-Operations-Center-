<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#F2F4F8;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F4F8;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px rgba(10,14,26,.12);">
        <!-- header -->
        <tr>
          <td style="background:#0A0E1A;padding:28px 32px;">
            <img src="cid:byrsa_logo" width="150" alt="Byrsa" style="display:block;border:0;outline:none;">
          </td>
        </tr>
        <!-- body -->
        <tr>
          <td style="padding:36px 34px 28px;">
            <p style="margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4F8EF7;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">{{ eyebrow }}</p>
            <h1 style="margin:0 0 14px;font-size:22px;font-weight:800;color:#0A0E1A;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">{{ greeting }}</h1>
            <p style="margin:0 0 26px;font-size:14px;line-height:1.7;color:#4B5768;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">{{ intro }}</p>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 26px;">
              <tr>
                <td align="center" style="background:#EEF4FF;border:1px solid #D7E4FB;border-radius:12px;padding:20px;">
                  <span style="display:block;font-family:'Courier New',Courier,monospace;font-size:34px;font-weight:700;letter-spacing:.28em;color:#1E3A8A;">{{ code }}</span>
                </td>
              </tr>
            </table>

            <p style="margin:0;font-size:12.5px;line-height:1.6;color:#8899BB;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">{{ expiry_note }}</p>
          </td>
        </tr>
        <!-- footer -->
        <tr>
          <td style="background:#F7F9FC;padding:20px 34px;border-top:1px solid #E7ECF3;">
            <p style="margin:0;font-size:11px;color:#8899BB;font-family:'Segoe UI',Helvetica,Arial,sans-serif;">{{ footer_note }}</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
